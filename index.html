<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criminal Case: Save the World – Progress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
<link rel="icon" type="image/jpeg" href="./MainIcon.jpg">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#cfdcf2; --panel:#f6f9ff; --ink:#0f1f3d; --muted:#4a5f85; --line:#adc0e2;
  --tape:#e8b122; --tape-ink:#0f1f3d; --head:#14327c; --head-ink:#f8f1d4; --slot:#e3ecfa;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1330; --panel:#10204a; --ink:#e9eefb; --muted:#98abd4; --line:#24407e;
    --head:#0a1840; --head-ink:#f8f1d4; --slot:#0b1738;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1330; --panel:#10204a; --ink:#e9eefb; --muted:#98abd4; --line:#24407e;
  --head:#0a1840; --head-ink:#f8f1d4; --slot:#0b1738;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Source Sans 3",system-ui,sans-serif}
header{background:linear-gradient(135deg,#0c2260,#1b44a8 60%,#0c2260);color:#f2c94c;padding:28px 20px 22px;border-bottom:6px solid var(--tape);
  background-image:repeating-linear-gradient(-45deg,transparent 0 22px,rgba(232,177,34,.10) 22px 44px),linear-gradient(135deg,#0c2260,#1b44a8 60%,#0c2260)}
header h1{margin:0;max-width:1200px;margin-inline:auto;font:700 clamp(28px,5vw,52px)/1.05 Oswald,Impact,sans-serif;letter-spacing:.01em}
header p{max-width:1200px;margin:6px auto 0;font-weight:600;color:#cfe0ff}
main{max-width:1200px;margin:0 auto;padding:24px 16px 80px}
section{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tape);margin-bottom:32px}
.sec-head{background:var(--head);color:var(--head-ink);display:flex;align-items:center;gap:12px;padding:10px 16px;border-left:8px solid var(--tape)}
.sec-title{flex:1;font:700 26px/1.2 Oswald,Impact,sans-serif;outline:none;min-width:0}
.count{font-size:14px;opacity:.75;white-space:nowrap}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px;table-layout:fixed}
th{font:500 15px Oswald,sans-serif;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);color:var(--muted)}
td{vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}
th:nth-child(1),td:nth-child(1){width:130px}
th:nth-child(2),td:nth-child(2){width:80px}
th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){width:150px}
th:nth-child(7),td:nth-child(7){width:44px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot{position:relative;width:96px;height:96px;background:var(--slot);border:2px dashed var(--line);display:grid;place-items:center;
  color:var(--muted);font-size:13px;text-align:center;cursor:pointer;overflow:hidden;padding:0}
.slot:hover,.slot:focus-visible{border-color:var(--tape);outline:none}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:none}
.slot.has:hover .x,.slot.has:focus-within .x{display:block}
.cap{width:100%;text-align:center;font-weight:600;outline:none;min-height:1.4em;overflow-wrap:anywhere}
.num{font:700 22px Oswald,sans-serif;text-align:center;outline:none;min-height:1.4em}
.desc{outline:none;min-height:96px;white-space:pre-wrap;overflow-wrap:anywhere}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);font-weight:400}
[contenteditable]:focus{background:var(--slot)}
.del{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
.del:hover{color:#c0392b}
.bar{padding:12px 16px}
button.add{font:500 16px Oswald,sans-serif;letter-spacing:.02em;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;cursor:pointer}
button.add:hover{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.sec-del{background:none;border:1px solid rgba(255,255,255,.35);color:var(--head-ink);padding:4px 10px;cursor:pointer;font:inherit;font-size:14px}
.sec-del:hover{border-color:#ff7b6b;color:#ff7b6b}
.empty{padding:20px;text-align:center;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:8px}
.slot.ro{cursor:default;border-style:solid}
.toolbar{background:var(--head);color:var(--head-ink);border-left:8px solid var(--tape);padding:10px 16px;margin-bottom:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar span{flex:1;min-width:220px}
.toolbar button{font:500 16px Oswald,sans-serif;border:2px solid var(--tape);background:var(--tape);color:var(--tape-ink);padding:8px 16px;cursor:pointer}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
</style>
</head>

const VIEW = !!PUBLISHED && !location.hash.includes("edit");
window.addEventListener("hashchange", ()=>location.reload());

const KEY = "cc-stw-progress-v1";
let data = null;
if (VIEW) data = PUBLISHED;
else { try { data = JSON.parse(localStorage.getItem(KEY)); } catch(e){ data = null; } }
if (!Array.isArray(data) || !data.length) data = PUBLISHED || starter();

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ console.error(e); } }, 250);
}

const app = document.getElementById("app");
const picker = document.getElementById("picker");
let pending = null;

function el(tag, props={}, kids=[]){
  const n = document.createElement(tag);
  for (const k in props){
    if (k === "class") n.className = props[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]);
    else n.setAttribute(k, props[k]);
  }
  kids.forEach(c => n.append(c));
  return n;
}
function editable(cls, ph, value, onInput, single){
  const n = el("div", {class:cls, contenteditable:VIEW?"false":"plaintext-only", "data-ph":VIEW?"":ph, spellcheck:"false"});
  n.textContent = value || "";
  n.addEventListener("input", ()=>{ onInput(n.textContent); save(); });
  if (single) n.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); n.blur(); }});
  return n;
}
function imgCell(obj, ph){
  const slot = el("div", {class:"slot"+(obj.img?" has":"")+(VIEW?" ro":""), ...(VIEW?{}:{tabindex:"0", role:"button", "aria-label":"Add image: "+ph})});
  if (VIEW){ if (obj.img) slot.append(el("img",{src:obj.img, alt:""})); return slot; }
  if (obj.img){
    slot.append(el("img",{src:obj.img, alt:""}));
    slot.append(el("button",{class:"x", title:"Remove image", "aria-label":"Remove image", onclick:e=>{ e.stopPropagation(); obj.img=""; save(); render(); }},["×"]));
  } else slot.textContent = "+ " + ph;
  const open = ()=>{ pending = obj; picker.click(); };
  slot.addEventListener("click", open);
  slot.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); }});
  return slot;
}
function cell(obj, imgLabel, capPh){
  return el("td",{},[ el("div",{class:"cell"},[ imgCell(obj, imgLabel), editable("cap", capPh, obj.txt, v=>obj.txt=v, true) ]) ]);
}

function render(){
  app.textContent = "";
  if (!VIEW) app.append(el("div",{class:"toolbar"},[ el("span",{},["Edit mode: your changes show only in this browser until you publish. Click Download page, then upload that file to your site."]), el("button",{onclick:exportPage},["Download page"]) ]));
  data.forEach((sec, si)=>{
    const head = el("div",{class:"sec-head"},[
      editable("sec-title","Section name",sec.name,v=>sec.name=v,true),
      el("span",{class:"count"},[sec.rows.length+(sec.rows.length===1?" case":" cases")]),
      VIEW?"":el("button",{class:"sec-del", onclick:()=>{ if(confirm("Delete the “"+(sec.name||"untitled")+"” section and all its cases?")){ data.splice(si,1); save(); render(); } }},["Delete section"])
    ]);
    const thead = el("thead",{},[ el("tr",{}, ["Country","Case #","Victim","Murder weapon","Killer","Description",""].map(t=>el("th",{scope:"col"},[t]))) ]);
    const tbody = el("tbody");
    sec.rows.forEach((r, ri)=>{
      tbody.append(el("tr",{},[
        cell(r.country,"Country","Country name"),
        el("td",{},[ editable("num","#",r.num,v=>r.num=v,true) ]),
        cell(r.victim,"Victim","Victim name"),
        cell(r.weapon,"Weapon","Weapon"),
        cell(r.killer,"Killer","Killer name"),
        el("td",{},[ editable("desc","Notes about this case…",r.desc,v=>r.desc=v,false) ]),
        el("td",{},[ VIEW?"":el("button",{class:"del",title:"Delete this case","aria-label":"Delete this case",onclick:()=>{ sec.rows.splice(ri,1); save(); render(); }},["×"]) ])
      ]));
    });
    const body = sec.rows.length
      ? el("div",{class:"wrap"},[ el("table",{},[thead,tbody]) ])
      : el("div",{class:"empty"},["No cases yet. Add the first one below."]);
    const bar = VIEW?"":el("div",{class:"bar"},[ el("button",{class:"add",onclick:()=>{ sec.rows.push(blank()); save(); render(); }},["+ Add case"]) ]);
    app.append(el("section",{},[head, body, bar]));
  });
  if (!VIEW) app.append(el("button",{class:"add",onclick:()=>{ data.push({name:"New region", rows:[blank()]}); save(); render(); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }},["+ Add section"]));
  if (!VIEW) app.append(el("p",{class:"foot"},["Everything saves automatically in this browser."]));
}

/* Uploaded images are shrunk to keep browser storage small */
picker.addEventListener("change", ()=>{
  const f = picker.files[0]; picker.value = "";
  if (!f || !pending) return;
  const target = pending; pending = null;
  const rd = new FileReader();
  rd.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const s = Math.min(1, 240/Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      target.img = c.toDataURL("image/webp",0.85);
      save(); render();
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
});

/* Saves a copy of this page with your progress built in (read-only for visitors) */
function exportPage(){
  const bs = String.fromCharCode(92);
  const json = JSON.stringify(data).split("<").join(bs + "u003c");
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector("#app").textContent = "";
  const s = clone.querySelector("#app-script");
  const t = s.textContent;
  const a = t.indexOf("/*PUB*/"), b = t.indexOf("/*END*/", a);
  s.textContent = t.slice(0, a) + "/*PUB*/" + json + t.slice(b);
  const blob = new Blob(["<!DOCTYPE html>" + clone.outerHTML], {type:"text/html"});
  const link = el("a",{href:URL.createObjectURL(blob), download:"criminal-case-tracker.html"});
  document.body.append(link); link.click(); link.remove();
}

render();
</script>
